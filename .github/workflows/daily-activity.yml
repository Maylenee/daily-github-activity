name: Daily Activity

on:
  schedule:
    # 01:00 UTC = 08:00 WIB (Asia/Jakarta)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure commit identity
        env:
          GH_USER_EMAIL: ${{ secrets.GH_USER_EMAIL }}
        run: |
          if [ -z "$GH_USER_EMAIL" ]; then
            echo "Secret GH_USER_EMAIL belum diatur."
            exit 1
          fi
          git config user.name "maylenee"
          git config user.email "$GH_USER_EMAIL"

      - name: Update daily activity (multiple commits)
        env:
          MIN_COMMITS: "40"
          MAX_COMMITS: "60"
        run: |
          # Jumlah commit acak per hari supaya kotak di graph makin gelap
          COUNT=$(shuf -i "${MIN_COMMITS}-${MAX_COMMITS}" -n 1)
          echo "Membuat $COUNT commit hari ini"
          for i in $(seq 1 "$COUNT"); do
            echo "Activity updated: $(date -u '+%Y-%m-%d %H:%M:%S') #$i" >> activity.txt
            git add activity.txt
            git commit -m "chore: daily activity $(date -u '+%Y-%m-%d') ($i/$COUNT)"
          done

      - name: Push
        run: git push